  "crates/gateway/src/control.rs",
  "crates/gateway/src/fencing.rs",
  "crates/gateway/src/forwarding.rs",
  "crates/gateway/src/identity.rs",
  "crates/gateway/src/lifecycle.rs",
  "crates/gateway/src/lib.rs",
  "crates/gateway/src/maintenance.rs",
  "crates/gateway/src/ports.rs",
  "crates/gateway/tests/control_plane.rs",
  "crates/gateway/tests/support/mod.rs",
  "tools/repo-policy/Cargo.toml",
  "tools/repo-policy/src/config.rs",
  "tools/repo-policy/src/diagnostic.rs",
  "tools/repo-policy/src/files.rs",
  "tools/repo-policy/src/lib.rs",
  "tools/repo-policy/src/license.rs",
  "tools/repo-policy/src/main.rs",
  "tools/repo-policy/src/markdown.rs",
  "tools/repo-policy/src/rust.rs",
  "tools/repo-policy/src/workflow.rs",
