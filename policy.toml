  ".editorconfig",
  ".gitattributes",
  "AGENTS.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "RELEASING.md",
  "CHANGELOG.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "Cargo.lock",
  "Cargo.toml",
  "clippy.toml",
  "Directory.Build.props",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "docs/ARCHITECTURE.md",
  "docs/CODING_STANDARDS.md",
  "docs/TESTING.md",
  "docs/COMPATIBILITY.md",
  "docs/LICENSING.md",
  "docs/WORKFLOWS.md",
  "docs/POLICY_AS_CODE.md",
  "docs/PRODUCT.md",
  "docs/REPOSITORY_LAYOUT.md",
