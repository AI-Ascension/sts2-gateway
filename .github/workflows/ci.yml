name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify fixed routes and bounded source changes
        run: |
          git diff --check
          grep -En 'State|LegalActions|DispatchAction|WaitForTransition|Reobserve|Recover' crates/gateway/src/bin/runtime_support/runtime_v3_gameplay.rs
          if grep -En 'arbitrary|proxy' crates/gateway/src/bin/runtime_support/runtime_v3_gameplay.rs; then exit 1; fi

      - name: Verify normative protocol artifact
        working-directory: protocol-artifact/poc-v1
        run: sha256sum --check SHA256SUMS

      - name: Verify canonical Runtime-v3 gameplay artifact
        working-directory: protocol-artifact/runtime-v3-gameplay
        run: sha256sum --check SHA256SUMS

      - name: Verify frozen Runtime-v1 and Runtime-v2 artifacts
        run: |
          (cd protocol-artifact/runtime-v1 && sha256sum --check SHA256SUMS)
          (cd protocol-artifact/runtime-v2 && sha256sum --check SHA256SUMS)

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Verify co-op synchronization artifact inventory
        working-directory: protocol-artifact/coop-synchronization-v1
        run: sha256sum -c SHA256SUMS

      - name: Verify every copied protocol artifact inventory
        # Discovers every SHA256SUMS under protocol-artifact/ so a profile copied later
        # (for example runtime-v4-expert or runtime-v4-expert-action) cannot be missed.
        run: |
          inventories=$(find protocol-artifact -mindepth 2 -name SHA256SUMS -type f | LC_ALL=C sort)
          test -n "$inventories"
          for inventory in $inventories; do
            (cd "$(dirname "$inventory")" && sha256sum --check SHA256SUMS)
          done

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check documentation links
        # A renamed or mistyped deny makes rustdoc emit `unknown lint` as a warning-only
        # diagnostic and still exit 0, so cargo's status alone is not evidence that the
        # lints this step names were accepted. Read the log for the counters as well.
        run: |
          set -o pipefail
          log=target/doc.log
          mkdir -p target
          status=0
          RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::redundant_explicit_links --document-private-items" \
            cargo doc --workspace --no-deps --locked 2>&1 | tee "$log" || status=$?
          errors=$(awk '/^error/{count++} END{print count+0}' "$log")
          unknown=$(awk '/unknown lint/{count++} END{print count+0}' "$log")
          warnings=$(awk '/^warning/{count++} END{print count+0}' "$log")
          echo "doc: exit=$status errors=$errors warnings=$warnings unknown_lints=$unknown"
          [ "$status" -eq 0 ] && [ "$errors" -eq 0 ] && [ "$warnings" -eq 0 ] && [ "$unknown" -eq 0 ]

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked
