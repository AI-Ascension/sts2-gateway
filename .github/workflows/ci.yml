name: Continuous integration

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify fixed routes and bounded source changes
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          git diff --check
          if [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ && "$BASE_REVISION" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_REVISION" HEAD
          else
            git show --format= --check HEAD
          fi
          grep -En 'State|LegalActions|DispatchAction|WaitForTransition|Reobserve|Recover' crates/gateway/src/bin/runtime_support/runtime_v3_gameplay.rs
          if grep -En 'arbitrary|proxy' crates/gateway/src/bin/runtime_support/runtime_v3_gameplay.rs; then exit 1; fi

      - name: Verify normative protocol artifact
        working-directory: protocol-artifact/poc-v1
        run: sha256sum --check SHA256SUMS

      - name: Verify canonical Runtime-v3 gameplay artifact
        working-directory: protocol-artifact/runtime-v3-gameplay
        run: sha256sum --check SHA256SUMS

      - name: Verify frozen Runtime-v1 and Runtime-v2 artifacts
        run: |
          (cd protocol-artifact/runtime-v1 && sha256sum --check SHA256SUMS)
          (cd protocol-artifact/runtime-v2 && sha256sum --check SHA256SUMS)

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Enforce repository policy
        run: cargo run --locked --package repo-policy -- --strict

      - name: Validate adopted standards bundle
        run: cargo run --locked --manifest-path standards/tools/standards-sync/Cargo.toml -- validate --root .

      - name: Verify co-op synchronization artifact inventory
        working-directory: protocol-artifact/coop-synchronization-v1
        run: sha256sum -c SHA256SUMS

      - name: Enforce production restrictions through Clippy
        run: cargo clippy --workspace --lib --bins --all-features --locked -- -D warnings -F clippy::unwrap_used -F clippy::expect_used -F clippy::panic -F clippy::todo -F clippy::unimplemented

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run Rust documentation tests
        run: cargo test --workspace --all-features --doc --locked
