name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify fixed routes and bounded source changes
        run: |
          git diff --check
          grep -En 'State|LegalActions|DispatchAction|WaitForTransition|Reobserve|Recover' crates/gateway/src/bin/runtime_support/runtime_v3_gameplay.rs
          if grep -En 'arbitrary|proxy' crates/gateway/src/bin/runtime_support/runtime_v3_gameplay.rs; then exit 1; fi

      - name: Verify normative protocol artifact
        working-directory: protocol-artifact/poc-v1
        run: sha256sum --check SHA256SUMS

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Apply Rust formatting
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Commit Rust formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply rustfmt"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked
